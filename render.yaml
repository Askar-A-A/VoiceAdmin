databases:
  - name: voiceadmin-db
    plan: free

services:
  - type: web
    name: voiceadmin
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: voiceadmin-db
          property: connectionString
      - key: CARRIERX_ACCESS_TOKEN
        sync: false
      - key: CARRIERX_CONTAINER_SID
        sync: false
