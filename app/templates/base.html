<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}VoicePortal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="/">VoicePortal</a>
      {% if user %}
      <div class="d-flex align-items-center gap-3">
        <a class="text-light small text-decoration-none" href="/accounts/settings/">{{ user.email }}</a>
        <form method="post" action="/accounts/logout/" class="m-0">
          <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>

  <div class="container py-4">
    {% for m in messages or [] %}
      <div class="alert alert-{{ m.category }}">{{ m.message }}</div>
    {% endfor %}
    {% for e in errors or [] %}
      <div class="alert alert-danger">{{ e }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
