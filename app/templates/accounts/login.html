{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <h1 class="h4 mb-3">Log in</h1>
    <form method="post" action="/accounts/login/">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input class="form-control mb-2" type="email" name="email"
             placeholder="Email" value="{{ email or '' }}" required autofocus>
      <input class="form-control mb-3" type="password" name="password"
             placeholder="Password" required>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="mt-3 small text-muted">No account? <a href="/accounts/register/">Register</a></p>
  </div>
</div>
{% endblock %}
