{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <h1 class="h4 mb-3">Create account</h1>
    <form method="post" action="/accounts/register/">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input class="form-control mb-2" type="email" name="email"
             placeholder="you@example.com" value="{{ email or '' }}" required autofocus>
      <input class="form-control mb-2" type="text" name="name"
             placeholder="Full name (optional)" value="{{ name or '' }}">
      <input class="form-control mb-2" type="password" name="password"
             placeholder="Password" required>
      <input class="form-control mb-3" type="password" name="confirm_password"
             placeholder="Confirm password" required>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 small text-muted">Already have an account? <a href="/accounts/login/">Log in</a></p>
  </div>
</div>
{% endblock %}
