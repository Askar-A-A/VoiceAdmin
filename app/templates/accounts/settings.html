{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1 class="h4 mb-4">Account settings</h1>

<div class="row g-4">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h2 class="h6">Profile</h2>
        <form method="post" action="/accounts/settings/">
          <input type="hidden" name="action" value="update_profile">
          <label class="form-label small">Email</label>
          <input class="form-control mb-2" type="email" name="email" value="{{ user.email }}" required>
          <label class="form-label small">Name</label>
          <input class="form-control mb-3" type="text" name="name" value="{{ user.name or '' }}">
          <button class="btn btn-primary btn-sm">Save profile</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h2 class="h6">Change password</h2>
        <form method="post" action="/accounts/settings/">
          <input type="hidden" name="action" value="change_password">
          <input class="form-control mb-2" type="password" name="current_password" placeholder="Current password" required>
          <input class="form-control mb-2" type="password" name="new_password" placeholder="New password" required>
          <input class="form-control mb-3" type="password" name="confirm_password" placeholder="Confirm new password" required>
          <button class="btn btn-primary btn-sm">Change password</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="mt-4 text-muted small">
  Files: {{ file_count }} &middot; Storage: {{ (total_bytes / 1024 / 1024) | round(1) }} MB
</div>
{% endblock %}
